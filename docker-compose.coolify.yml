# Coolify Deployment Reference
# 
# Coolify does NOT use docker-compose files directly.
# Instead, create resources via Coolify UI:
# 
# 1. PostgreSQL Resource
#    - Coolify → Resources → Databases → PostgreSQL
#    - Name: autoblog-db
#    - Coolify auto-generates DATABASE_URL → copy to App env
#
# 2. App (Next.js)
#    - Coolify → Applications → New → Dockerfile
#    - Repository: this repo
#    - Build: Dockerfile
#    - Port: 3000
#    - Health Check: GET /api/health (200/503)
#    - Environment Variables (from .env.example + DATABASE_URL from step 1)
#
# 3. Worker (pg-boss)
#    - Coolify → Applications → New → Dockerfile (same repo)
#    - Command: npm run worker
#    - Port: (none - worker doesn't expose HTTP)
#    - Same env vars as App
#
# 4. Domain + HTTPS
#    - Coolify → Domains → Add your-domain.com
#    - Point A record to Coolify server IP
#    - Coolify auto-provisions Let's Encrypt cert via Traefik
#
# This file is for reference only - Coolify manages services via its UI.

