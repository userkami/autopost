# Local development only — for production/Coolify, use Coolify-managed resources
# Coolify provides: PostgreSQL, reverse proxy (Traefik + auto-HTTPS), env management
# This compose file is kept for `docker compose up` local testing

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: autoblog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoblog}
      POSTGRES_DB: autoblog
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # exposed for local development only
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U autoblog -d autoblog']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://autoblog:${POSTGRES_PASSWORD:-autoblog}@db:5432/autoblog
    expose:
      - '3000'
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: npm run worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://autoblog:${POSTGRES_PASSWORD:-autoblog}@db:5432/autoblog
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: