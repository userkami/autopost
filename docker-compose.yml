services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: autoblog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoblog}
      POSTGRES_DB: autoblog
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # exposed for local development only; remove once running behind Caddy
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U autoblog -d autoblog']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://autoblog:${POSTGRES_PASSWORD:-autoblog}@db:5432/autoblog
    expose:
      - '3000'
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: npm run worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://autoblog:${POSTGRES_PASSWORD:-autoblog}@db:5432/autoblog
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      APP_URL: ${APP_URL:-http://localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  caddy_data:
  caddy_config:
